name: Project Quality Gates

on:
  push:
    branches:
      - codex/phase-1-data-ui
      - codex/phase-2-decision-engine
      - phase-0-foundation
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    name: Lint, typecheck, build, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Official MIT-licensed GitHub actions. Release lines were verified on 2026-08-28.
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Real PostgreSQL migration and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: asha_integration
          POSTGRES_USER: postgres
          # Disposable CI-only fixture, never used by an application or external DB.
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Test real database and backup/restore
        run: npm run test:db
        env:
          ASHA_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/asha_integration
          # Client tools are from the exact same reviewed server image.
          ASHA_PG_CONTAINER_ID: ${{ job.services.postgres.id }}

  laboratory:
    name: Synthetic Python financial laboratory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/financial-lab
    steps:
      - uses: actions/checkout@v6
      - name: Use pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: packages/financial-lab/.python-version
      - name: Verify standard-library-only dependency boundary
        run: python -c "import pathlib,tomllib; data=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); assert data['project']['dependencies'] == []"
      - name: Compile laboratory source
        run: python -m compileall -q src tests
      - name: Test synthetic contracts and calculations
        run: python -m unittest discover -s tests -v
