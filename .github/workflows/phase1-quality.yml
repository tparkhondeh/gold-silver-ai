name: Phase 1 Quality Gates

on:
  push:
    branches:
      - codex/phase-1-data-ui
      - phase-0-foundation
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    name: Lint, typecheck, build, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Official MIT-licensed GitHub actions. Release lines were verified on 2026-08-28.
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
